name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

# Releases are serialised: two runs would otherwise compute the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # The release commit itself carries nothing to release.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...

      # magic-releaser releases itself: version, notes, release commit, tag and
      # the GitHub release.
      - id: release
        uses: ./

      - name: Check out the release
        if: steps.release.outputs.released == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: git checkout "$TAG"
      - uses: docker/setup-qemu-action@v4
        if: steps.release.outputs.released == 'true'
      - uses: docker/setup-buildx-action@v4
        if: steps.release.outputs.released == 'true'
      - uses: docker/login-action@v4
        if: steps.release.outputs.released == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # GoReleaser attaches binaries and publishes the image to the release
      # magic-releaser has just created.
      - uses: goreleaser/goreleaser-action@v7
        if: steps.release.outputs.released == 'true'
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
