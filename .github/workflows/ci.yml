name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Layering
        run: ./scripts/check-layering.sh
      - name: Test
        run: go test -race -cover ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check

  # The action is exercised on this very repository, the same way a user runs
  # it, without writing anything.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: release
        uses: ./
        with:
          dry-run: "true"
      - name: Check outputs
        env:
          RELEASED: ${{ steps.release.outputs.released }}
        run: test "$RELEASED" = "false"
